<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicOS Web Demo</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 12px;
         background: #111; color: #ccc; font: 14px system-ui, sans-serif; }
  #canvas { width: min(640px, calc(100vw - 32px)); aspect-ratio: 1;
            image-rendering: pixelated; background: #000; outline: none; }
  #status { min-height: 1.2em; }
  .keys { opacity: .7; text-align: center; max-width: 640px; padding: 0 16px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<div class="keys">Arrows move · Enter selects · Esc backs out · F10 system menu. Networking and native apps are not available in the browser.</div>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    // The dev-command stub polls stdin; Emscripten's default is window.prompt().
    stdin: function () { return null; },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { statusEl.textContent = t; },
    monitorRunDependencies: function (left) {
      if (!left) statusEl.textContent = '';
    },
  };
  // Browsers only start audio after a user gesture.
  window.addEventListener('keydown', function resume() {
    var ctx = Module.SDL2 && Module.SDL2.audioContext;
    if (ctx && ctx.state === 'suspended') ctx.resume();
  });
  Module.canvas.focus();
</script>
{{{ SCRIPT }}}
</body>
</html>
