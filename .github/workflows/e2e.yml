name: E2E Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: scripts/ci/install-sim-deps.sh

      - name: Setup Python
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build_sim
          # Same key as build-sim.yml; no restore-keys (stale builds).
          key: ${{ runner.os }}-simulator-${{ hashFiles('simulator/**', 'src/**', 'CMakeLists.txt', 'cmake/**', 'Makefile', 'scripts/ci/install-sim-deps.sh') }}

      - name: Build simulator
        run: |
          source .venv/bin/activate
          make simulator

      - name: Run E2E tests
        run: |
          source .venv/bin/activate
          # tee opens its output file when the pipeline starts, before pytest
          # has created reports/ for --html — without this the step failed with
          # "tee: reports/test-output.txt: No such file or directory" even when
          # every test passed.
          mkdir -p reports
          # And take pytest's status, not tee's: a bare pipeline reports the
          # last command, so a passing tee would mask a failing suite.
          set -o pipefail
          export SDL_VIDEODRIVER=dummy
          # Per-test timeout (60 s), strict xfail and the skip allow-list come
          # from pytest.ini and tests/e2e/conftest.py. Each failing test's
          # simulator stdout/stderr, log buffer, error.log and screenshot land
          # under reports/failures/.
          pytest tests/e2e/ \
            -v \
            --tb=short \
            --durations=20 \
            --html=reports/e2e-report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml \
            --artifacts-dir=reports/failures \
            -n auto 2>&1 | tee reports/test-output.txt
        timeout-minutes: 10

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: reports/

  summary:
    needs: e2e
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Test Summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.e2e.result }}" == "success" ]; then
            echo "✅ All E2E tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e.result }}" == "failure" ]; then
            echo "❌ E2E tests failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the 'e2e-results' artifact for details (reports/failures/ has per-test simulator diagnostics)." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ E2E tests were skipped or cancelled" >> $GITHUB_STEP_SUMMARY
          fi
